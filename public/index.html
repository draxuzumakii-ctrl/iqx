<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .panel h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input[type="file"] {
            padding: 8px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            background: #fafafa;
        }

        .form-group input[type="file"]:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .form-group input[type="color"] {
            width: 50px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            padding: 0;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            cursor: pointer;
            margin: 0;
        }

        .message-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .message-card + .message-card {
            margin-top: 20px;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .message-title {
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            font-size: 1.1rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .preview-panel {
            background: #1b2226;
            border-radius: 15px;
            padding: 20px;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 20px;
        }

        .preview-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .preview-container img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: none;
        }

        .preview-placeholder {
            color: #888;
            text-align: center;
            padding: 40px 20px;
        }

        .preview-placeholder .icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 20px;
        }

        .preview-placeholder p {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: #667eea;
            font-weight: 500;
        }

        .download-section {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .download-btn {
            background: #28a745;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #218838;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .preview-panel {
                position: static;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 WhatsApp Chat Generator</h1>
            <p>Buat gambar chat WhatsApp kustom dengan mudah</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="main-content">
            <div class="panel">
                <h2>📝 Konfigurasi Chat</h2>
                
                <!-- Settings -->
                <div class="form-group">
                    <label>Warna Background</label>
                    <input type="color" id="backgroundColor" value="#1b2226">
                </div>

                <div class="form-group">
                    <label>Lebar Gambar (px)</label>
                    <input type="number" id="width" value="512" min="200" max="1000">
                </div>

                <div class="form-group">
                    <label>Skala</label>
                    <select id="scale">
                        <option value="1">1x</option>
                        <option value="2" selected>2x</option>
                        <option value="3">3x</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tipe Output</label>
                    <select id="outputType">
                        <option value="image" selected>Image</option>
                        <option value="stories">Stories</option>
                        <option value="quote">Quote</option>
                    </select>
                </div>

                <!-- Message 1 -->
                <div class="message-card">
                    <div class="message-header">
                        <span class="message-title">💬 Pesan 1</span>
                    </div>
                    
                    <div class="form-group">
                        <label>Nama Pengirim</label>
                        <input type="text" id="msg1Name" value="Mukidi Slamet Sentosa">
                    </div>

                    <div class="form-group">
                        <label>Nomor Telepon</label>
                        <input type="text" id="msg1Number" value="+6212345678909">
                    </div>

                    <div class="form-group">
                        <label>Waktu</label>
                        <input type="text" id="msg1Time" value="11:21">
                    </div>

                    <div class="form-group">
                        <label>Pesan</label>
                        <textarea id="msg1Text">Ini adalah contoh pesan dengan teks tebal, teks miring, dan monospace. Juga ada emoji! 😄</textarea>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="msg1Avatar" checked>
                        <label>Gunakan Avatar Default</label>
                    </div>

                    <div class="form-group" id="msg1AvatarUpload" style="display: none;">
                        <label>Upload Avatar Kustom</label>
                        <input type="file" id="msg1AvatarFile" accept="image/*">
                    </div>

                    <div class="form-group">
                        <label>Upload Media/Gambar</label>
                        <input type="file" id="msg1Media" accept="image/*">
                    </div>

                    <div class="form-group">
                        <label>Balasan ke Pesan (Nama)</label>
                        <input type="text" id="msg1ReplyName" placeholder="Nama pesan yang dibalas">
                    </div>

                    <div class="form-group">
                        <label>Teks Balasan</label>
                        <input type="text" id="msg1ReplyText" placeholder="Teks pesan yang dibalas">
                    </div>
                </div>

                <!-- Message 2 -->
                <div class="message-card">
                    <div class="message-header">
                        <span class="message-title">💬 Pesan 2</span>
                    </div>
                    
                    <div class="form-group">
                        <label>Nama Pengirim</label>
                        <input type="text" id="msg2Name" value="Upin Ipin Botak!">
                    </div>

                    <div class="form-group">
                        <label>Nomor Telepon</label>
                        <input type="text" id="msg2Number" value="+6212345678909">
                    </div>

                    <div class="form-group">
                        <label>Waktu</label>
                        <input type="text" id="msg2Time" value="11:23">
                    </div>

                    <div class="form-group">
                        <label>Pesan</label>
                        <textarea id="msg2Text">Ini adalah contoh pesan kedua untuk membalas pesan media dari pesan pertama!</textarea>
                    </div>

                    <div class="form-group">
                        <label>Upload Avatar Kustom</label>
                        <input type="file" id="msg2Avatar" accept="image/*">
                    </div>

                    <div class="form-group">
                        <label>Upload Media/Gambar</label>
                        <input type="file" id="msg2Media" accept="image/*">
                    </div>
                </div>

                <button class="btn btn-primary" id="generateBtn" onclick="generateImage()">
                    🎨 Generate Gambar
                </button>
            </div>

            <div class="preview-panel">
                <div class="preview-container">
                    <div class="preview-placeholder" id="placeholder">
                        <span class="icon">📱</span>
                        <p>Preview gambar akan muncul di sini</p>
                        <p style="font-size: 0.9rem;">Klik "Generate Gambar" untuk membuat</p>
                    </div>
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p>Membuat gambar...</p>
                    </div>
                    <img id="previewImage" alt="Preview Chat">
                    <div class="download-section" id="downloadSection">
                        <a href="#" class="download-btn" id="downloadBtn" download="whatsapp-chat.png">
                            💾 Download Gambar
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toggle avatar upload untuk pesan 1
        document.getElementById('msg1Avatar').addEventListener('change', function() {
            const avatarUpload = document.getElementById('msg1AvatarUpload');
            avatarUpload.style.display = this.checked ? 'none' : 'block';
        });

        async function generateImage() {
            const generateBtn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const placeholder = document.getElementById('placeholder');
            const previewImage = document.getElementById('previewImage');
            const downloadSection = document.getElementById('downloadSection');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // Reset messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            // Show loading
            generateBtn.disabled = true;
            loading.style.display = 'block';
            placeholder.style.display = 'none';
            previewImage.style.display = 'none';
            downloadSection.style.display = 'none';

            try {
                // Create FormData
                const formData = new FormData();

                // Add text data
                formData.append('backgroundColor', document.getElementById('backgroundColor').value);
                formData.append('width', document.getElementById('width').value);
                formData.append('scale', document.getElementById('scale').value);
                formData.append('outputType', document.getElementById('outputType').value);

                // Message 1 data
                formData.append('msg1Name', document.getElementById('msg1Name').value);
                formData.append('msg1Number', document.getElementById('msg1Number').value);
                formData.append('msg1Time', document.getElementById('msg1Time').value);
                formData.append('msg1Text', document.getElementById('msg1Text').value);
                formData.append('msg1Avatar', document.getElementById('msg1Avatar').checked);
                formData.append('msg1ReplyName', document.getElementById('msg1ReplyName').value);
                formData.append('msg1ReplyText', document.getElementById('msg1ReplyText').value);

                // Message 2 data
                formData.append('msg2Name', document.getElementById('msg2Name').value);
                formData.append('msg2Number', document.getElementById('msg2Number').value);
                formData.append('msg2Time', document.getElementById('msg2Time').value);
                formData.append('msg2Text', document.getElementById('msg2Text').value);

                // Add files if they exist
                const msg1AvatarFile = document.getElementById('msg1AvatarFile').files[0];
                if (msg1AvatarFile) {
                    formData.append('avatar1', msg1AvatarFile);
                }

                const msg2AvatarFile = document.getElementById('msg2Avatar').files[0];
                if (msg2AvatarFile) {
                    formData.append('avatar2', msg2AvatarFile);
                }

                const msg1MediaFile = document.getElementById('msg1Media').files[0];
                if (msg1MediaFile) {
                    formData.append('media1', msg1MediaFile);
                }

                const msg2MediaFile = document.getElementById('msg2Media').files[0];
                if (msg2MediaFile) {
                    formData.append('media2', msg2MediaFile);
                }

                // Send request to server
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    // Show preview
                    previewImage.src = result.imageUrl;
                    previewImage.style.display = 'block';
                    downloadSection.style.display = 'block';
                    
                    // Update download link
                    const downloadBtn = document.getElementById('downloadBtn');
                    downloadBtn.href = `/api/download/${result.filename}`;

                    // Show success message
                    successMessage.textContent = '✅ Gambar berhasil dibuat!';
                    successMessage.style.display = 'block';
                } else {
                    throw new Error(result.error || 'Gagal membuat gambar');
                }

            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = '❌ Gagal membuat gambar: ' + error.message;
                errorMessage.style.display = 'block';
            } finally {
                // Hide loading
                generateBtn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
                      </html>
